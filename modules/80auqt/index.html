<section class="modulex-tanitim-gorsel-serit{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-tanitim-gorsel-serit-ic">
    {{fbbas}}
    {{fbgovde}}

</section>

<style>
  /* tanitim-gorsel-serit — Metin sabit, görseller ve maddeler bir ray boyunca gezilir; galeri ile tanıtımı birleştirir. */
  .modulex-tanitim-gorsel-serit { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-tanitim-gorsel-serit *, .modulex-tanitim-gorsel-serit *::before, .modulex-tanitim-gorsel-serit *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-tanitim-gorsel-serit :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-tanitim-gorsel-serit :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-tanitim-gorsel-serit :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-tanitim-gorsel-serit :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-tanitim-gorsel-serit img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-tanitim-gorsel-serit) img { height: auto; }
  .modulex-tanitim-gorsel-serit [hidden] { display: none !important; }
  .modulex-tanitim-gorsel-serit :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-tanitim-gorsel-serit :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-tanitim-gorsel-serit-ic { max-width: --max--; margin-inline: auto; }
  .modulex-tanitim-gorsel-serit-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-tanitim-gorsel-serit--bassiz .modulex-tanitim-gorsel-serit-bas { display: none; }
  .modulex-tanitim-gorsel-serit-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-tanitim-gorsel-serit-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-tanitim-gorsel-serit-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-tanitim-gorsel-serit-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-tanitim-gorsel-serit-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-tanitim-gorsel-serit-dugme:hover { transform: translateY(-2px); }
  .modulex-tanitim-gorsel-serit-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-tanitim-gorsel-serit-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-tanitim-gorsel-serit-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-tanitim-gorsel-serit-duzen { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); gap: clamp(28px, 4vw, 56px); align-items: center; }
  .modulex-tanitim-gorsel-serit-yazi { display: grid; gap: 18px; }
  .modulex-tanitim-gorsel-serit-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 300px); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .modulex-tanitim-gorsel-serit-ray::-webkit-scrollbar { display: none; }
  .modulex-tanitim-gorsel-serit-kart { display: grid; align-content: end; gap: 10px; min-height: 380px; overflow: hidden; border-radius: --yuvarlak--; scroll-snap-align: start; }
  .modulex-tanitim-gorsel-serit-kart--gorsel { padding: 0; }
  .modulex-tanitim-gorsel-serit-gorsel { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .modulex-tanitim-gorsel-serit-kart--gorsel:hover .modulex-tanitim-gorsel-serit-gorsel { transform: scale(1.05); }
  .modulex-tanitim-gorsel-serit-kart--madde { padding: 26px; background: --kartBg--; }
  .modulex-tanitim-gorsel-serit-mikon { color: --accentInk--; font-size: 36px; margin-block-end: auto; }
  .modulex-tanitim-gorsel-serit-kontrol { display: flex; gap: 10px; }
  .modulex-tanitim-gorsel-serit-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background 0.25s ease, opacity 0.25s ease; }
  .modulex-tanitim-gorsel-serit-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; border-color: --accent--; }
  .modulex-tanitim-gorsel-serit-ok:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-tanitim-gorsel-serit-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-tanitim-gorsel-serit-ray { grid-auto-columns: 78%; }
    .modulex-tanitim-gorsel-serit-kart { min-height: 300px; }
  }
  .modulex-tanitim-gorsel-serit-bag { color: inherit; text-decoration: none; }
  .modulex-tanitim-gorsel-serit-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-tanitim-gorsel-serit-mbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-tanitim-gorsel-serit-mmetin { color: --muted--; font-size: 0.95rem; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-gorsel-serit :is(.modulex-tanitim-gorsel-serit-baslik, .modulex-tanitim-gorsel-serit-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-gorsel-serit-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-tanitim-gorsel-serit { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-tanitim-gorsel-serit *, .modulex-tanitim-gorsel-serit *::before, .modulex-tanitim-gorsel-serit *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-tanitim-gorsel-serit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
